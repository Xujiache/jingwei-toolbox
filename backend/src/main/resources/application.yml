spring:
  application:
    name: jingwei-toolbox-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jingwei_toolbox?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:jingwei}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.xujiache.jingweitoolbox: ${LOG_LEVEL_APP:INFO}

app:
  auth:
    # HS256 签名密钥，生产环境必须通过环境变量提供不少于 32 字节的随机值
    jwt-secret: ${JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdef}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:120}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
    guest-session-ttl-hours: ${GUEST_SESSION_TTL_HOURS:24}
